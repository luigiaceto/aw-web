[project]
name = "aw-web"
dynamic = ["version"]
description = "Interfaccia web locale per guardare anime"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "pip-system-certs>=5.2",
]

[project.urls]
Homepage = "https://github.com/luigiaceto/aw-web"
Repository = "https://github.com/luigiaceto/aw-web"

[project.scripts]
aw-web = "aw_web.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aw_web"]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=8.4.2",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # le righe lunghe le gestisce ruff format; restano solo HTML/SVG nelle stringhe
