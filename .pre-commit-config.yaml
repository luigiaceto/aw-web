repos:
  # Hook standard per la pulizia del codice
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Hook per pyright (type checker)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        always_run: true

  # Hook per pytest (esegue i test)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked pytest # Esegue pytest usando l'ambiente gestito da uv
        language: system
        pass_filenames: false # Esegue tutti i test, non solo i file modificati
        always_run: true

  # Hook opzionale per mantenere uv.lock aggiornato
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.2
    hooks:
      - id: uv-lock
